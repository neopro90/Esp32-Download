[env:cyd3248s035r_wrover_n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
; Use the CYD's generic ESP32/WROOM-compatible board profile.
board = esp32dev
framework = arduino

upload_port = COM6
upload_speed = 115200
monitor_port = COM6
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; Keep the WROOM-compatible DIO Flash profile; override capacity to 16 MiB.
; The WROVER module's 8 MiB QSPI PSRAM is auto-detected by the driver.
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = dio_qspi
board_build.partitions = cyd_16mb.csv

build_flags =
    -I include
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE

lib_deps =
    lvgl/lvgl@^8.3.11
    lovyan03/LovyanGFX@^1.2.7
