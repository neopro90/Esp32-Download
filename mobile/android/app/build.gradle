plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.github.mik3y:usb-serial-for-android:3.11.0'
}

android {
    namespace 'com.espdownload.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.espdownload.mobile'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.3.1.7'
        buildConfigField 'boolean', 'FRESH_INSTALL_TEST', 'false'
        externalNativeBuild {
            cmake {
                arguments "-DESP_SERIAL_FLASHER_DIR=${file('src/main/cpp/esp-serial-flasher').absolutePath}"
            }
        }
    }

    flavorDimensions += 'installation'
    productFlavors {
        standard {
            dimension 'installation'
            manifestPlaceholders = [appLabel: 'ESP Download']
        }
        freshTest {
            dimension 'installation'
            applicationIdSuffix '.fresh'
            versionNameSuffix '-fresh-test'
            buildConfigField 'boolean', 'FRESH_INSTALL_TEST', 'true'
            manifestPlaceholders = [appLabel: 'ESP Download Test']
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(project.property('RELEASE_STORE_FILE'))
                storePassword project.property('RELEASE_STORE_PASSWORD')
                keyAlias project.property('RELEASE_KEY_ALIAS')
                keyPassword project.property('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    ndkVersion '27.2.12479018'
}
