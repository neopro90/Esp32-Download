[platformio]
default_envs =
    cyd_wroom32_4mb
    esp32_s2_4mb
    esp32_s3_4mb
    esp32_c3_4mb
    esp32_c5_4mb
    esp32_c6_4mb

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
upload_speed = 460800
monitor_port = COM3
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 3932160
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^7.4.2

[env:cyd_wroom32_4mb]
board = esp32dev
upload_port = COM3
monitor_port = COM3

[env:esp32_s2_4mb]
board = esp32-s2-saola-1
build_flags = -DESP_DOWNLOAD_TARGET_S2

[env:esp32_s3_4mb]
board = esp32-s3-devkitc1-n4r2
build_flags = -DESP_DOWNLOAD_TARGET_S3

[env:esp32_c3_4mb]
board = esp32-c3-devkitm-1
build_flags = -DESP_DOWNLOAD_TARGET_C3

[env:esp32_c5_4mb]
board = esp32-c5-devkitc1-n4
build_flags = -DESP_DOWNLOAD_TARGET_C5

[env:esp32_c6_4mb]
board = esp32-c6-devkitm-1
build_flags = -DESP_DOWNLOAD_TARGET_C6
